<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>צבעוני! - משחק קלפים</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ED1C24">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="צבעוני!">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Welcome Screen -->
  <div id="welcome-screen" class="screen">
    <div class="welcome-content">
      <h1 class="game-title">צבעוני!</h1>
      <p class="welcome-subtitle">משחק הקלפים המוכר והאהוב</p>
      <div class="game-mode-section">
        <span class="player-count-label">מצב משחק</span>
        <div class="game-mode-buttons">
          <button class="game-mode-btn active" data-mode="local" aria-label="מצב מקומי">מקומי</button>
          <button class="game-mode-btn" data-mode="online" aria-label="מצב אונליין">אונליין</button>
        </div>
      </div>
      <div class="match-mode-section">
        <span class="player-count-label">סוג משחק</span>
        <div class="match-mode-buttons">
          <button class="match-mode-btn active" data-match-mode="single" aria-label="סיבוב יחיד">סיבוב יחיד</button>
          <button class="match-mode-btn" data-match-mode="points" aria-label="משחק נקודות">עד 250 נק'</button>
        </div>
      </div>
      <div class="player-count-section">
        <span class="player-count-label">כמה שחקנים?</span>
        <div class="player-count-buttons">
          <button class="player-count-btn" data-count="2" aria-label="2 שחקנים">2</button>
          <button class="player-count-btn" data-count="3" aria-label="3 שחקנים">3</button>
          <button class="player-count-btn active" data-count="4" aria-label="4 שחקנים">4</button>
        </div>
      </div>
      <div id="online-panel" class="online-panel hidden" aria-live="polite">
        <label class="online-label" for="nickname-input">כינוי</label>
        <input id="nickname-input" class="online-input" type="text" maxlength="20" placeholder="guest" aria-label="כינוי אונליין">
        <div class="online-actions">
          <button id="quick-match-btn" class="btn-secondary" aria-label="התאמה מהירה">התאמה מהירה</button>
          <button id="create-room-btn" class="btn-secondary" aria-label="יצירת חדר פרטי">צור חדר</button>
        </div>
        <div class="join-room-row">
          <input id="room-code-input" class="online-input room-code-input" type="text" maxlength="8" placeholder="קוד חדר" aria-label="קוד חדר">
          <button id="join-room-btn" class="btn-secondary" aria-label="הצטרף לחדר">הצטרף</button>
        </div>
        <div id="online-status" class="online-status"></div>
      </div>
      <button id="start-btn" class="btn btn-primary" aria-label="התחל משחק">בואו נשחק!</button>
      <button id="stats-btn" class="btn-stats" aria-label="סטטיסטיקות">📊</button>
    </div>
    <button id="welcome-mute-btn" class="btn-mute-welcome" title="השתק/הפעל צלילים" aria-label="השתק צלילים">🔊</button>
  </div>

  <!-- Game Table -->
  <div id="game-screen" class="screen hidden">
    <div class="game-table">

      <!-- Bot Top -->
      <div class="bot-area bot-top" id="bot-top">
        <div class="bot-name">שחקן 3</div>
        <div class="bot-hand" id="bot-top-hand"></div>
      </div>

      <!-- Bot Left -->
      <div class="bot-area bot-left" id="bot-left">
        <div class="bot-name">שחקן 2</div>
        <div class="bot-hand" id="bot-left-hand"></div>
      </div>

      <!-- Center Area -->
      <div class="center-area">
        <div class="draw-pile" id="draw-pile" role="button" aria-label="שלוף קלף">
          <div class="card card-back">צבעוני</div>
        </div>
        <div class="discard-pile" id="discard-pile"></div>
        <div class="direction-indicator" id="direction-indicator"></div>
        <div class="turn-message" id="turn-message"></div>
      </div>

      <!-- Bot Right -->
      <div class="bot-area bot-right" id="bot-right">
        <div class="bot-name">שחקן 4</div>
        <div class="bot-hand" id="bot-right-hand"></div>
      </div>

      <!-- Restart Button -->
      <button id="restart-btn" class="btn-restart" title="משחק חדש" aria-label="משחק חדש">&#x21BB;</button>
      <button id="mute-btn" class="btn-mute" title="השתק/הפעל צלילים" aria-label="השתק צלילים">🔊</button>
      <div id="session-banner" class="session-banner hidden"></div>

      <!-- Player Area -->
      <div class="player-area">
        <div class="player-hand" id="player-hand"></div>
        <button id="last-card-btn" class="btn btn-last-card hidden" aria-label="קרא אחרון">אחרון!</button>
      </div>

      <div id="game-announcements" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    </div>
  </div>

  <!-- Color Picker Overlay -->
  <div id="color-picker" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="color-picker-title">
    <div class="color-picker-content">
      <h2 id="color-picker-title">בחר צבע?</h2>
      <div class="color-buttons">
        <button class="color-btn color-red" data-color="red" aria-label="אדום"></button>
        <button class="color-btn color-blue" data-color="blue" aria-label="כחול"></button>
        <button class="color-btn color-green" data-color="green" aria-label="ירוק"></button>
        <button class="color-btn color-yellow" data-color="yellow" aria-label="צהוב"></button>
      </div>
      <button id="color-picker-cancel" class="btn-cancel-color" aria-label="ביטול">ביטול</button>
    </div>
  </div>

  <!-- Restart Confirmation -->
  <div id="restart-confirm" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="restart-confirm-title">
    <div class="restart-confirm-content">
      <h2 id="restart-confirm-title">משחק חדש?</h2>
      <p>ההתקדמות במשחק הנוכחי תאבד</p>
      <div class="restart-confirm-buttons">
        <button id="restart-confirm-yes" class="btn btn-primary">כן, משחק חדש</button>
        <button id="restart-confirm-no" class="btn-cancel-restart">חזרה למשחק</button>
      </div>
    </div>
  </div>

  <!-- End Screen -->
  <div id="end-screen" class="screen hidden">
    <div id="confetti-container"></div>
    <div class="end-message" id="end-message"></div>
    <div class="end-subtitle" id="end-subtitle"></div>
    <div class="end-scoreboard" id="end-scoreboard"></div>
    <div class="end-actions">
      <button id="play-again-btn" class="btn btn-primary" aria-label="שחק שוב">שחק שוב</button>
      <button id="back-to-menu-btn" class="btn-secondary end-menu-btn" aria-label="חזרה לתפריט">לתפריט</button>
    </div>
  </div>

  <div id="animation-layer"></div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      var isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '::1';
      if (isLocalhost) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(reg) { reg.unregister(); });
        }).catch(function() {});
      } else {
        navigator.serviceWorker.register('service-worker.js').catch(function() {});
      }
    }
  </script>
</body>
</html>
